services:
  app:
    build: .
    image: travel-rag-agent
    env_file: .env            # TOUR_API_KEY
    environment:
      # 적재할 지역 (쉼표 구분). 추가 후 재시작하면 새 지역만 수집해 덧붙임
      # 사용 가능: 서울 인천 대전 대구 광주 부산 울산 세종 경기 강원 충북 충남 경북 경남 전북 전남 제주
      DATA_CITIES: "제주"
    ports:
      - "7860:7860"
    volumes:
      - hf-cache:/cache/huggingface   # 모델 캐시 (약 8GB, 최초 1회 다운로드)
      - chroma-data:/app/chroma_db    # 벡터DB 영속화
    # Qwen2.5-3B(float32, ~12GB) + bge-m3 로딩 시 메모리 필요. Docker Desktop 메모리 설정 확인
    restart: unless-stopped

volumes:
  hf-cache:
  chroma-data:
